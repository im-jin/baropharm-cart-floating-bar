<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09b9ba" />
  <title>Aroundpharm — K-Pharmacy</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../tokens.css" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-loading="true" data-base="../" data-default-product="re2o-ampoule">

  <!-- ──────── TOP NAV (원본 + 언어 스위처 추가) ──────── -->
  <header class="topnav">
    <button class="iconbtn" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div class="topnav-right">
      <!-- ─ NEW: 언어 스위처 ─ -->
      <div class="lang-wrap">
        <button class="lang-switcher" id="langSwitcher" aria-haspopup="listbox" aria-expanded="false">
          <span class="lang-globe" aria-hidden="true">🌐</span>
          <span class="lang-current" data-lang-label>EN</span>
          <span class="lang-caret" aria-hidden="true">▾</span>
        </button>
        <ul class="lang-menu" id="langMenu" role="listbox" hidden>
          <li role="option" data-lang="ko">한국어</li>
          <li role="option" data-lang="en">English</li>
          <li role="option" data-lang="zh">中文</li>
          <li role="option" data-lang="ja">日本語</li>
        </ul>
      </div>

      <button class="iconbtn" aria-label="Share">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/>
          <path d="M8 11l8-4M8 13l8 4"/>
        </svg>
      </button>
      <button class="iconbtn iconbtn-cart" id="cartBtn" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 4h2l2.5 12h11l2-8H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/>
        </svg>
        <span class="cart-badge" id="cartBadge" hidden>0</span>
      </button>
    </div>
  </header>

  <main class="page">

    <!-- ──────── TOP SECTION (responsive: 모바일 = column, 데스크탑 = 2-col grid) ──────── -->
    <div class="top-section">

    <!-- ──────── HERO + THUMB STRIP (LEFT on desktop) ──────── -->
    <section class="hero top-visual">
      <div class="hero-media">
        <img class="hero-img" data-product="hero" alt="" />
      </div>
      <div class="thumb-strip" id="thumbStrip">
        <!-- thumbs injected -->
      </div>
    </section>

    <!-- ──────── INFO BLOCK (RIGHT on desktop) ──────── -->
    <div class="top-info">

    <!-- ──────── BRAND + 이름 + 가격 ──────── -->
    <section class="meta">
      <div class="brand-row">
        <span class="brand-chip" data-product="brand"></span>
        <!-- ─ NEW: Pharmacist's Pick 배지 (DS 적용) ─ -->
        <span class="badge-pick">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true">
            <path d="M8 1.5l1.9 3.85 4.25.62-3.07 3 .72 4.23L8 11.2 4.2 13.2l.72-4.23-3.07-3 4.25-.62L8 1.5z"/>
          </svg>
          <span data-i18n="ui.pharmacist_pick"></span>
        </span>
      </div>

      <h1 class="product-name" data-product="name"></h1>
      <p class="product-tagline" data-product="tagline"></p>

      <div class="price-block">
        <span class="price-discount" data-product="discount"></span>
        <span class="price-current" data-product="price"></span>
        <span class="price-original" data-product="price_original"></span>
      </div>
    </section>

    <!-- ──────── 약사픽 요약 카드 (원본) ──────── -->
    <section class="pick-summary">
      <div class="pick-summary-title">
        <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
          <path d="M8 1.5l1.9 3.85 4.25.62-3.07 3 .72 4.23L8 11.2 4.2 13.2l.72-4.23-3.07-3 4.25-.62L8 1.5z"/>
        </svg>
        <span data-i18n="ui.pharmacist_pick"></span>
      </div>
      <div class="pick-summary-head">
        <div class="pick-stars">
          <span class="star">★</span>
          <span class="pick-score" data-product="rating"></span>
        </div>
        <button class="pick-link" data-i18n="ui.see_all_reviews"></button>
      </div>
      <ul class="pick-bars">
        <li><span class="bar-label" data-i18n="pick.efficacy"></span><span class="bar"><i style="--p:92%"></i></span><span class="bar-val">92%</span></li>
        <li><span class="bar-label" data-i18n="pick.absorption"></span><span class="bar"><i style="--p:88%"></i></span><span class="bar-val">88%</span></li>
        <li><span class="bar-label" data-i18n="pick.scent"></span><span class="bar"><i style="--p:80%"></i></span><span class="bar-val">80%</span></li>
        <li><span class="bar-label" data-i18n="pick.value"></span><span class="bar"><i style="--p:85%"></i></span><span class="bar-val">85%</span></li>
      </ul>
    </section>

    <!-- ──────── NEW: 3-ICON QUICK BENEFITS (DS 적용) ──────── -->
    <section class="benefits">
      <div class="benefit">
        <div class="benefit-icon" aria-hidden="true">💧</div>
        <div class="benefit-label" data-i18n="benefits.hydration"></div>
      </div>
      <div class="benefit">
        <div class="benefit-icon" aria-hidden="true">✨</div>
        <div class="benefit-label" data-i18n="benefits.anti_aging"></div>
      </div>
      <div class="benefit">
        <div class="benefit-icon" aria-hidden="true">🛡️</div>
        <div class="benefit-label" data-i18n="benefits.sensitive"></div>
      </div>
    </section>

    <!-- ──────── PC 전용: 주문 블록 (배송정보 + 수량 + 듀얼 CTA + 약국찾기) ──────── -->
    <section class="order-block" aria-label="Order">
      <dl class="order-shipping">
        <dt data-i18n="order.delivery_method"></dt>
        <dd data-i18n="order.delivery_method_value"></dd>
        <dt data-i18n="order.delivery_fee"></dt>
        <dd>
          <span class="ship-fee-main" data-i18n="order.delivery_fee_value"></span>
          <span class="ship-fee-sub" data-i18n="order.delivery_fee_jeju"></span>
          <span class="ship-fee-sub" data-i18n="order.delivery_fee_island"></span>
        </dd>
      </dl>

      <div class="order-qty">
        <div class="qty-stepper" role="group" aria-label="Quantity">
          <button class="qty-btn" data-qty="dec" aria-label="Decrease">−</button>
          <span class="qty-val" id="qtyVal">1</span>
          <button class="qty-btn" data-qty="inc" aria-label="Increase">＋</button>
        </div>
        <span class="qty-line-price" id="qtyLinePrice"></span>
      </div>

      <div class="order-total">
        <span class="order-total-label">
          <span data-i18n="order.qty_label"></span>
          <span id="totalQty">1</span>
          <span data-i18n="order.qty_unit"></span>
        </span>
        <span class="order-total-val">
          <span data-i18n="order.total_label"></span>
          <span id="totalPrice"></span>
        </span>
      </div>

      <div class="order-cta-row">
        <button class="btn btn-ghost btn-half" data-action="save">
          <span data-i18n="ui.cta_save"></span>
        </button>
        <button class="btn btn-primary btn-half" data-action="shop">
          <span data-i18n="ui.cta_shop"></span>
        </button>
      </div>

      <button class="btn btn-ghost btn-block btn-find-pharmacy" data-action="findPharmacy">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/>
        </svg>
        <span data-i18n="order.find_pharmacy"></span>
      </button>
    </section>

    </div><!-- /.top-info -->
    </div><!-- /.top-section -->

    <!-- ──────── 함께 쓰면 좋은 제품 (라인업 추천 캐러셀) ──────── -->
    <section class="related-products" id="relatedProducts" hidden>
      <h2 class="related-title" data-i18n="related.title"></h2>
      <div class="related-scroll" id="relatedScroll">
        <!-- cards injected by JS -->
      </div>
    </section>

    <!-- ──────── 약사 영상 (추천 제품 아래, 명확한 구분) ──────── -->
    <section class="pharmacist-video-block">
      <header class="pharmacist-video-header">
        <span class="pharmacist-video-eyebrow">
          <svg viewBox="0 0 16 16" width="11" height="11" fill="currentColor" aria-hidden="true">
            <path d="M8 1.5l1.9 3.85 4.25.62-3.07 3 .72 4.23L8 11.2 4.2 13.2l.72-4.23-3.07-3 4.25-.62L8 1.5z"/>
          </svg>
          <span>K-약사</span>
        </span>
        <h2 class="pharmacist-video-title" data-i18n="video.title"></h2>
        <p class="pharmacist-video-desc" data-i18n="video.caption"></p>
      </header>
      <div class="pharmacist-video">
        <div class="pharmacist-video-frame">
          <video
            class="pharmacist-video-el"
            autoplay muted loop playsinline preload="metadata"
            aria-label="Pharmacist video">
            <source src="" type="video/mp4" />
          </video>
          <button class="pharmacist-video-mute" id="videoMute" aria-label="Toggle mute">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" data-state="muted">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ──────── 탭 (원본: 상세/리뷰/추천 — 약국찾기 제거) ──────── -->
    <nav class="tabs" role="tablist">
      <button class="tab is-active" role="tab" data-tab="detail" data-i18n="tabs.detail"></button>
      <button class="tab" role="tab" data-tab="review" data-i18n="tabs.review"></button>
      <button class="tab" role="tab" data-tab="related" data-i18n="tabs.related"></button>
    </nav>

    <!-- ──────── 탭 콘텐츠 ──────── -->
    <section class="tab-panel is-active" role="tabpanel" data-panel="detail">
      <div class="detail-modules" id="detailModules">
        <!-- 언어별 이미지 -->
      </div>

      <!-- ─ NEW: How-to 픽토그램 (DS 적용) ─ -->
      <div class="howto">
        <h2 class="section-title" data-i18n="ui.how_to_use"></h2>
        <ol class="howto-steps">
          <li class="howto-step">
            <div class="howto-num">1</div>
            <div class="howto-icon" aria-hidden="true">🧴</div>
            <div class="howto-label" data-i18n="howto.step1"></div>
          </li>
          <li class="howto-step">
            <div class="howto-num">2</div>
            <div class="howto-icon" aria-hidden="true">💆</div>
            <div class="howto-label" data-i18n="howto.step2"></div>
          </li>
          <li class="howto-step">
            <div class="howto-num">3</div>
            <div class="howto-icon" aria-hidden="true">🌙</div>
            <div class="howto-label" data-i18n="howto.step3"></div>
          </li>
        </ol>
      </div>
    </section>

    <section class="tab-panel" role="tabpanel" data-panel="review" hidden>
      <!-- 종합 별점 -->
      <div class="review-summary">
        <div class="review-score-num" data-product="rating"></div>
        <div class="review-score-stars" aria-hidden="true">★★★★★</div>
        <div class="review-score-count">
          <span data-i18n="review.total_reviews"></span>
          <span data-product="review_count_raw"></span>
          <span data-i18n="review.count_unit"></span>
        </div>
      </div>

      <!-- 4 카테고리 통계 (피부타입 / 연령대 / 피부고민 / 지역) -->
      <div class="review-stats" id="reviewStats">
        <!-- injected -->
      </div>

      <!-- 정렬 + 포토리뷰 토글 -->
      <div class="review-controls">
        <div class="sort-tabs" id="sortTabs" role="tablist">
          <button class="sort-tab is-active" data-sort="latest" data-i18n="review.sort.latest"></button>
          <button class="sort-tab" data-sort="popular" data-i18n="review.sort.popular"></button>
          <button class="sort-tab" data-sort="rating_high" data-i18n="review.sort.rating_high"></button>
          <button class="sort-tab" data-sort="rating_low" data-i18n="review.sort.rating_low"></button>
        </div>
        <label class="photo-toggle">
          <input type="checkbox" id="photoOnly" />
          <span data-i18n="review.photo_only"></span>
        </label>
      </div>

      <!-- 리뷰 카드 리스트 -->
      <ul class="review-list" id="reviewList">
        <!-- injected -->
      </ul>
    </section>

    <section class="tab-panel" role="tabpanel" data-panel="related" hidden>
      <p class="empty-state" data-i18n="ui.related_empty"></p>
    </section>

    <!-- ──────── NEW: Aroundpharm 가치 카드 (DS 적용) ──────── -->
    <section class="ap-card">
      <div class="ap-card-icon" aria-hidden="true">🌍</div>
      <h2 class="ap-card-title" data-i18n="ap.title"></h2>
      <p class="ap-card-body" data-i18n="ap.body"></p>
      <button class="btn btn-ghost btn-block" data-action="getApp" data-i18n="ui.get_app"></button>
    </section>

    <footer class="page-footer">
      <div class="footer-row">
        <a href="https://aroundpharm.com" target="_blank" rel="noopener">aroundpharm.com</a>
      </div>
      <p class="footer-note" data-i18n="footer.staff_hint"></p>
    </footer>

  </main>

  <!-- ──────── STICKY 단일 담기 CTA + 수량 stepper ──────── -->
  <div class="sticky-cta sticky-cta--cart">
    <div class="sticky-qty-stepper" role="group" aria-label="Quantity">
      <button class="sticky-qty-btn" data-sticky-qty="dec" aria-label="Decrease">−</button>
      <span class="sticky-qty-val" id="stickyQtyVal">1</span>
      <button class="sticky-qty-btn" data-sticky-qty="inc" aria-label="Increase">＋</button>
    </div>
    <button class="btn btn-primary btn-add-to-cart" data-action="addToCart">
      <span data-i18n="ui.cta_add_to_cart"></span>
    </button>
  </div>

  <!-- ──────── CART 모달 (담긴 제품 + 재고 + 약사 보여주기) ──────── -->
  <div class="cart-modal" id="cartModal" hidden>
    <div class="cart-modal-backdrop" id="cartModalBackdrop"></div>
    <div class="cart-modal-sheet">
      <header class="cart-modal-head">
        <h2 class="cart-modal-title" data-i18n="cart.title"></h2>
        <button class="cart-modal-close" id="cartModalClose" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M6 6l12 12M6 18L18 6"/>
          </svg>
        </button>
      </header>

      <div class="cart-modal-body">
        <!-- 카트 아이템 리스트 -->
        <ul class="cart-items" id="cartItems"></ul>

        <!-- 비어있을 때 -->
        <div class="cart-empty" id="cartEmpty" hidden>
          <div class="cart-empty-icon" aria-hidden="true">🛒</div>
          <p data-i18n="cart.empty"></p>
        </div>

        <!-- 총액 -->
        <div class="cart-total" id="cartTotal" hidden>
          <span data-i18n="cart.total"></span>
          <strong id="cartTotalAmount"></strong>
        </div>

        <!-- 근처 약국 재고 (Figma style) -->
        <div class="cart-stock" id="cartStock" hidden>
          <div class="cart-stock-head">
            <div class="cart-stock-title-wrap">
              <div class="cart-stock-title" data-i18n="cart.stock_title"></div>
              <div class="cart-stock-sub" data-i18n="cart.stock_sub"></div>
            </div>
          </div>
          <ul class="cart-stock-list" id="cartStockList">
            <!-- JS renders from strings.cart.pharmacies -->
          </ul>
        </div>
      </div>

      <footer class="cart-modal-foot" id="cartFoot" hidden>
        <button class="btn btn-primary btn-block btn-show-cart" data-action="showCartToPharmacist">
          <span data-i18n="cart.show_to_pharmacist"></span>
        </button>
      </footer>
    </div>
  </div>

  <!-- ──────── 약사 보여주기 모달 (멀티 아이템) ──────── -->
  <div class="show-cart-modal" id="showCartModal" hidden>
    <button class="show-cart-modal-close" id="showCartModalClose" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M6 6l12 12M6 18L18 6"/>
      </svg>
    </button>

    <div class="show-cart-modal-inner">
      <div class="show-cart-modal-eyebrow" data-i18n="cart.show_modal_items"></div>
      <h2 class="show-cart-modal-title" data-i18n="cart.show_modal_title"></h2>

      <ul class="show-cart-items" id="showCartItems"></ul>

      <div class="show-cart-total">
        <span data-i18n="cart.total"></span>
        <strong id="showCartTotalAmount"></strong>
      </div>

      <div class="show-cart-message" data-i18n="cart.show_modal_message"></div>

      <div class="show-cart-pharmacy">
        <span class="show-cart-pharmacy-label" data-i18n="cart.show_modal_pharmacy_label"></span>
        <span class="show-cart-pharmacy-name" id="showCartPharmacyName"></span>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div class="toast" id="toast" hidden></div>

  <script src="../script.js?v=4"></script>
</body>
</html>
