<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09b9ba" />
  <title>DS Sample — 공통 컴포넌트로 그린 화면</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <!-- 공통 디자인시스템: 토큰 + 컴포넌트 (이게 전부) -->
  <link rel="stylesheet" href="../../tokens.css?v=1" />
  <link rel="stylesheet" href="../../components.css?v=1" />

  <style>
    /* 페이지 프레임/레이아웃만 (컴포넌트 스타일 아님) */
    body {
      margin: 0;
      background: var(--color-grey-2);
      font-family: var(--font-family-default);
      min-height: 100vh;
    }
    .frame {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--color-bg-base-white);
      box-shadow: var(--shadow-secondary);
      display: flex; flex-direction: column;
    }
    .app-bar { position: sticky; top: 0; z-index: 10; }
    .scroll { flex: 1; overflow-y: auto; padding-bottom: 96px; }
    .sec { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .row--between { justify-content: space-between; }
    .row--wrap { flex-wrap: wrap; }
    .muted { color: var(--color-text-secondary); font-size: 13px; }
    .price { font-size: 22px; font-weight: 800; color: var(--color-text); letter-spacing: -.5px; }
    .strike { color: var(--color-text-tertiary); text-decoration: line-through; font-size: 14px; }
    .name { font-size: 17px; font-weight: 700; color: var(--color-text); letter-spacing: -.3px; line-height: 1.35; }
    .thumb { width: 64px; height: 64px; border-radius: var(--radius-md); background: var(--color-bg-card-soft); flex: 0 0 auto; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sticky-bar {
      position: sticky; bottom: 0;
      display: flex; gap: 8px;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      background: var(--color-bg-base-white);
      border-top: 1px solid var(--color-border-secondary);
    }
    .ico { width: 22px; height: 22px; display: block; }
    .note { margin: 0 16px 8px; font-size: 12px; color: var(--color-text-tertiary); }
  </style>
</head>
<!-- 브랜드 테마: 한 줄로 --color-primary* = 어라운드팜 틸 -->
<body class="brand-aroundpharm">
  <div class="frame">

    <!-- ───── App Bar (공통) ───── -->
    <header class="app-bar">
      <div class="app-bar-leading">
        <button class="btn-icon btn-icon--circle" aria-label="뒤로">
          <svg class="icon"><use href="../../icons.svg#chevron-left"/></svg>
        </button>
      </div>
      <div class="app-bar-title">주문하기</div>
      <div class="app-bar-trailing">
        <button class="btn-icon btn-icon--circle" aria-label="더보기">
          <svg class="icon"><use href="../../icons.svg#more-vert"/></svg>
        </button>
      </div>
    </header>

    <div class="scroll">

      <!-- ───── 제품 요약 카드 (Card · Chip · Badge · Button) ───── -->
      <div class="sec">
        <div class="card card--elevated">
          <div class="row" style="align-items:flex-start; gap:14px;">
            <div class="thumb"></div>
            <div style="flex:1; min-width:0;">
              <div class="row row--between">
                <span class="chip chip--primary chip--sm">THOME</span>
                <span class="badge badge--primary">약사픽</span>
              </div>
              <div class="name" style="margin:8px 0 6px;">CPR 트리플시너지 링클케어 세럼</div>
              <div class="row" style="align-items:baseline; gap:6px;">
                <span class="price">₩36,000</span>
                <span class="strike">₩40,000</span>
                <span class="badge" style="background:var(--color-primary);">10%</span>
              </div>
            </div>
          </div>

          <div class="divider" style="margin:14px 0;"></div>

          <!-- 수량 stepper (Button) -->
          <div class="row row--between">
            <span class="muted">수량</span>
            <div class="row" style="gap:0; border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden;">
              <button class="btn btn--ghost btn--sm" aria-label="감소">−</button>
              <span style="min-width:40px; text-align:center; font-weight:700;">1</span>
              <button class="btn btn--ghost btn--sm" aria-label="증가">＋</button>
            </div>
          </div>
        </div>

        <!-- 태그들 (Chip) -->
        <div class="row row--wrap">
          <span class="chip chip--sm">재구매율 1위</span>
          <span class="chip chip--sm">민감성 OK</span>
          <span class="chip chip--sm">흡수 빠름</span>
        </div>
      </div>

      <div class="divider divider--thick-block"></div>

      <!-- ───── 탭 (Tabs) ───── -->
      <nav class="tabs">
        <button class="tab is-active">혜택</button>
        <button class="tab">배송 <span class="tab-count">(2)</span></button>
        <button class="tab">안내</button>
      </nav>

      <!-- 탭 콘텐츠: 리스트 (Card--flat · Badge) -->
      <div class="sec">
        <div class="card card--flat list-row">
          <div class="row">
            <svg class="icon" style="color:var(--color-primary)"><use href="../../icons.svg#check-circle"/></svg>
            <div>
              <div style="font-weight:700;">적립 1,080P</div>
              <div class="muted">결제 시 3% 적립</div>
            </div>
          </div>
          <span class="badge badge--success">적립</span>
        </div>
        <div class="card card--flat list-row">
          <div class="row">
            <svg class="icon" style="color:var(--color-text-secondary)"><use href="../../icons.svg#truck"/></svg>
            <div>
              <div style="font-weight:700;">무료배송</div>
              <div class="muted">오늘 출발 · 내일 도착</div>
            </div>
          </div>
          <span class="badge badge--neutral">무료</span>
        </div>
      </div>

      <!-- 입력 (Input) -->
      <p class="note">배송 요청사항</p>
      <div class="sec" style="padding-top:0;">
        <input class="input" placeholder="예) 부재 시 문 앞에 놓아주세요" />
      </div>

    </div>

    <!-- ───── 하단 CTA (Button: secondary + primary) ───── -->
    <div class="sticky-bar">
      <button class="btn btn--secondary btn--lg">장바구니</button>
      <button class="btn btn--primary btn--lg btn--block">₩36,000 결제하기</button>
    </div>

  </div>
</body>
</html>
